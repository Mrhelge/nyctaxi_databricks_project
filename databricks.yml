# This is a Declarative Automation Bundle definition for nyctaxi_de_project_2026.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: nyctaxi_de_project_2026
  uuid: d3ceba70-af33-4f94-a1c2-1065881b3f0f

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: default catalog
    default: nyctaxi_project_dev
  landing_schema:
    default: landing
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold

artifacts:
  nyctaxi_whl:
    type: whl
    build: uv build --wheel 
    path: .
    dynamic_version: true

targets:
  free:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1cd5697e-9e43.cloud.databricks.com

  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: false
    workspace:
      host: https://adb-7405606859270025.5.azuredatabricks.net

  test:
    mode: production
    presets:
      name_prefix: "[test] "
    workspace:
      host: https://adb-7405619356768328.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/olegaci11@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: nyctaxi_project_test
    permissions:
      - service_principal_name: ad11e708-11b6-4871-891a-97ede239d6e6
        level: CAN_MANAGE
    run_as:
      service_principal_name: ad11e708-11b6-4871-891a-97ede239d6e6

  prod:
    mode: production
    workspace:
      host: https://adb-7405617868343214.14.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/olegaci11@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: nyctaxi_project_prod
    permissions:
      - service_principal_name: 650cdb9c-cad5-4380-981f-d5be51eed302
        level: CAN_MANAGE
    run_as:
      service_principal_name: 650cdb9c-cad5-4380-981f-d5be51eed302